[workspace]
members = [
    "crates/framescope-core",
    "crates/framescope-video",
    "crates/framescope-cache",
    "crates/framescope-similarity",
    "crates/framescope-similarity-store",
    "crates/framescope-perceptual",
    "crates/framescope-grouping",
    "crates/framescope-grouping-session",
    "crates/framescope-group-navigation",
    "crates/framescope-group-navigation-video",
    "crates/framescope-extraction",
    "crates/framescope-extraction-video",
    "crates/framescope-extraction-image",
    "crates/framescope-extraction-groups",
    "crates/framescope-extraction-groups-video",
    "crates/framescope-extraction-groups-output",
    "crates/framescope-extraction-manifest",
    "crates/framescope-extraction-output",
    "crates/framescope-ffi",
    "crates/framescope-ffmpeg",
    "crates/framescope-test-support",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jni = "=0.22.4"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"