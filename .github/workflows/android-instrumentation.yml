name: Android instrumentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: '27.3.13750724'
  CARGO_NDK_VERSION: '4.1.2'
  GRADLE_VERSION: '8.13'
  RUST_ANDROID_TOOLCHAIN: '1.86.0'

jobs:
  build-arm64-test-apks:
    name: build-arm64-test-apks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust Android target
        run: |
          rustup toolchain install "$RUST_ANDROID_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_ANDROID_TOOLCHAIN"

      - name: Restore Cargo Android build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            rust/target
          key: cargo-android-arm64-rust-${{ env.RUST_ANDROID_TOOLCHAIN }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/crates/**/Cargo.toml', 'rust/crates/framescope-ffmpeg/build.rs', 'rust/crates/framescope-ffmpeg/native/**', 'scripts/build-rust.sh', 'scripts/build-ffmpeg-android.sh', 'scripts/verify-ffmpeg-android.sh') }}
          restore-keys: |
            cargo-android-arm64-rust-${{ env.RUST_ANDROID_TOOLCHAIN }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-

      - name: Install cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "cargo-ndk $CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
          fi

      - name: Build app and instrumentation APKs
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Verify app APK native packaging
        run: bash ./scripts/verify-debug-apk.sh

      - name: Upload ARM64 instrumentation APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framescope-arm64-instrumentation-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1

  arm64-emulator-scrub-tests:
    name: arm64-emulator-scrub-tests
    needs: build-arm64-test-apks
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Download ARM64 instrumentation APKs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: framescope-arm64-instrumentation-${{ github.sha }}
          path: artifacts

      - name: Execute scrub and bitmap ownership instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: arm64-v8a
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb devices -l
            adb install -r artifacts/app-debug.apk
            adb install -r artifacts/app-debug-androidTest.apk
            adb shell pm list instrumentation
            adb shell am instrument -w -r \
              -e class com.framescope.app.ui.MicroscopeTimelineControlsTest,com.framescope.app.data.PreviewBitmapPoolTest \
              com.framescope.app.test/androidx.test.runner.AndroidJUnitRunner
