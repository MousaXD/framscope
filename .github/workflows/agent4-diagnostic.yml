name: agent4-diagnostic

on:
  push:
    branches:
      - perf/scrub-ram-acceleration

permissions:
  contents: read

jobs:
  rust-clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Workspace clippy diagnostics
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --exclude framescope-video --exclude framescope-integration -- -D warnings 2>&1 | tee agent4-clippy.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent4-clippy-log
          path: rust/agent4-clippy.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve clippy result
        if: always()
        shell: bash
        run: exit "${{ steps.clippy.outputs.status }}"
