name: Phase 7 physical-device kit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/phase7-device-kit.yml'
      - 'acceptance/phase7/**'
      - 'scripts/verify-phase7-device-report.py'
      - 'docs/phase7-device-provider-acceptance.md'

permissions:
  contents: read

# This validates kit generation only. Real device evidence remains manual.

env:
  ANDROID_NDK_VERSION: '27.3.13750724'
  CARGO_NDK_VERSION: '4.1.2'
  GRADLE_VERSION: '8.13'
  RUST_ANDROID_TOOLCHAIN: '1.86.0'

jobs:
  device-kit:
    name: device-kit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''
      - name: Install Android SDK NDK and fixture tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$ANDROID_NDK_VERSION"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Build physical-test APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and kit template
        run: |
          bash ./scripts/verify-debug-apk.sh
          python3 scripts/verify-phase7-device-report.py --template acceptance/phase7/device-report.template.json
