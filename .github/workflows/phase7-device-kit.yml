name: Phase 7 physical-device kit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/phase7-device-kit.yml'
      - 'acceptance/phase7/**'
      - 'scripts/verify-phase7-device-report.py'
      - 'docs/phase7-device-provider-acceptance.md'

permissions:
  contents: read

# This validates kit generation only. Real device evidence remains manual.

env:
  ANDROID_NDK_VERSION: '27.3.13750724'
  CARGO_NDK_VERSION: '4.1.2'
  GRADLE_VERSION: '8.13'
  RUST_ANDROID_TOOLCHAIN: '1.86.0'

jobs:
  device-kit:
    name: device-kit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Android SDK NDK and fixture tools
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Set up Rust Android target
        run: |
          rustup toolchain install "$RUST_ANDROID_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_ANDROID_TOOLCHAIN"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"

      - name: Generate and verify deterministic physical media corpus
        run: |
          bash ./scripts/generate-video-fixtures.sh
          python3 ./scripts/verify-video-fixtures.py
          bytes="$(du -sb build/video-fixtures | cut -f1)"
          test "$bytes" -le 1048576

      - name: Build physical-test debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify physical-test APK packaging
        run: bash ./scripts/verify-debug-apk.sh

      - name: Stage physical-device kit
        run: |
          kit="build/phase7-device-kit"
          apk="$kit/FrameScope-physical-test.apk"
          mkdir -p "$kit/media"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$kit/FrameScope-physical-test.apk.sha256"
          cp build/video-fixtures/* "$kit/media/"
          cp acceptance/phase7/device-report.template.json "$kit/device-report.json"
          cp docs/phase7-device-provider-acceptance.md "$kit/README.md"

          commit="$(git rev-parse HEAD)"
          version="$(awk -F= '$1 == "versionName" { print $2 }' version.properties | tr -d '\r')"
          apk_sha="$(sha256sum "$apk" | awk '{ print $1 }')"
          printf '%s\n' "$commit" > "$kit/tested-commit.txt"
          printf 'versionName=%s\n' "$version" > "$kit/version.txt"

          python3 - "$kit/device-report.json" "$commit" "$version" "$apk_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          report = json.loads(path.read_text(encoding="utf-8"))
          report["tested_commit"] = sys.argv[2]
          report["app_version"] = sys.argv[3]
          report["build_type"] = "debug"
          report["tested_apk_sha256"] = sys.argv[4]
          path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY

          python3 scripts/verify-phase7-device-report.py --template "$kit/device-report.json"

      - name: Upload physical-device kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: framescope-phase7-device-kit-${{ github.sha }}
          path: build/phase7-device-kit
          if-no-files-found: error
          retention-days: 7
