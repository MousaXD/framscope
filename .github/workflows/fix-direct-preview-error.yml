name: Fix direct preview error conversion

on:
  push:
    branches:
      - perf/direct-bounded-scrub-preview
    paths:
      - .github/workflows/fix-direct-preview-error.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/direct-bounded-scrub-preview
          fetch-depth: 0

      - name: Fix explicit index error conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/framescope-video/src/target_rgba_navigation.rs')
          text = path.read_text()
          start_marker = 'pub fn navigate_to_frame_bounded_preview_with_cursor<D, F>('
          end_marker = 'fn navigate_target_preview_retained<D, F>('
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          old = '.entry(frame_id)?'
          if body.count(old) != 1:
              raise SystemExit(f'expected one bounded direct index error site, found {body.count(old)}')
          body = body.replace(
              old,
              '.entry(frame_id)\n        .map_err(CachedNavigationError::from)?',
              1,
          )
          path.write_text(text[:start] + body + text[end:])
          PY

      - name: Validate Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          cd rust
          cargo +1.85.1 fmt --all --check
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings

      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/fix-direct-preview-error.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix bounded preview index error conversion'
          git push origin HEAD:perf/direct-bounded-scrub-preview
