name: Agent 4 continuation helper

on:
  push:
    branches:
      - perf/scrub-ram-acceleration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/scrub-ram-acceleration
      - name: Set up Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Rust format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Target navigation tests
        working-directory: rust
        run: cargo test -p framescope-video target_rgba_navigation --lib
