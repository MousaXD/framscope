name: Agent 4 continuation helper

on:
  push:
    branches:
      - perf/scrub-ram-acceleration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/scrub-ram-acceleration
      - name: Scope legacy preview helper to tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/framescope-ffi/src/scrub_handoff.rs')
          text = path.read_text()
          old = "fn begin_preview_operation(\n"
          new = "#[cfg(test)]\nfn begin_preview_operation(\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy preview wrapper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Set up Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Rust format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust workspace tests
        working-directory: rust
        run: cargo test --workspace
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/framescope-ffi/src/scrub_handoff.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(agent4): scope preview test helper correctly'
          git push origin HEAD:perf/scrub-ram-acceleration
