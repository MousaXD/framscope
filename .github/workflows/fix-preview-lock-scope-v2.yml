name: Restore preview lock scope v2

on:
  push:
    branches:
      - perf/direct-bounded-scrub-preview
    paths:
      - .github/workflows/fix-preview-lock-scope-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/direct-bounded-scrub-preview
          fetch-depth: 0

      - name: Apply lock-scope repair structurally
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          target = Path('rust/crates/framescope-video/src/target_rgba_navigation.rs')
          text = target.read_text()
          fn_start = text.index('pub fn navigate_to_frame_bounded_preview_with_cursor<D, F>(')
          fn_end = text.index('fn navigate_target_preview_retained<D, F>(', fn_start)
          body = text[fn_start:fn_end]
          body = replace_once(body, '    cache: &mut FrameCacheHierarchy,\n', '', 'bounded cache parameter')

          key_start = body.index('    let key = match FrameCacheKey::new(')
          can_continue = body.index('    let can_continue = cursor', key_start)
          body = body[:key_start] + body[can_continue:]

          ram_start = body.index('    if let Some(key) = key.as_ref() {')
          decoded_start = body.index('    let decoded = if can_continue {', ram_start)
          body = body[:ram_start] + body[decoded_start:]
          text = text[:fn_start] + body + text[fn_end:]

          test_start = text.index('fn bounded_preview_miss_never_populates_full_quality_cache()')
          call_start = text.index('let preview = navigate_to_frame_bounded_preview_with_cursor(', test_start)
          call_end = text.index('        .unwrap();', call_start)
          call = text[call_start:call_end]
          call = replace_once(call, '            &mut cache,\n', '', 'bounded test cache argument')
          text = text[:call_start] + call + text[call_end:]
          target.write_text(text)

          ffi = Path('rust/crates/framescope-ffi/src/scrub_handoff.rs')
          text = ffi.read_text()
          text = replace_once(
              text,
              'use framescope_cache::{FrameCacheHierarchy, FrameId};',
              'use framescope_cache::{FrameCacheError, FrameCacheHierarchy, FrameCacheKey, FrameId};',
              'ffi cache imports',
          )
          text = replace_once(
              text,
              '    CachedFrameSource, CachedNavigationError, CancellationToken, MicroscopeTimestampSelection,\n',
              '    CachedNavigationError, CancellationToken, MicroscopeTimestampSelection,\n',
              'ffi video imports',
          )

          render_marker = '#[cfg(unix)]\nfn render_preview('
          helper = '''#[cfg(unix)]
fn source_quality_ram_hit(
    session_id: i64,
    frame_id: FrameId,
    state: &Arc<Mutex<ScrubSessionState>>,
) -> Result<Option<framescope_cache::OwnedRgbaFrame>, PreviewFailure> {
    microscope::with_extraction_context(session_id, |_source_fd, index| {
        let key = match FrameCacheKey::new(
            index.source_identity(),
            index.stream_identity().stream_index,
            frame_id,
        ) {
            Ok(key) => key,
            Err(FrameCacheError::UnsafeSourceIdentity) => return Ok(None),
            Err(error) => return Err(PreviewFailure::new("cache_error", error.to_string())),
        };
        let mut state = state.lock().map_err(|_| {
            PreviewFailure::new("bridge_error", "Live preview cache state is poisoned.")
        })?;
        Ok(state.source_cache.lookup_full(&key).map(|cached| cached.pixels))
    })
    .map_err(from_microscope_failure)?
}

'''
          text = replace_once(text, render_marker, helper + render_marker, 'source RAM helper insertion')

          render_start = text.index(render_marker)
          render_end = text.index('#[cfg(not(unix))]\nfn render_preview(', render_start)
          render = text[render_start:render_end]

          old_comment = '''    // Only source-cache lookup/decode needs the authoritative source/index borrow. The shared RAM
    // hierarchy means exact navigation and scrub can hit the same immutable RGBA allocation. The
    // session lock is released before downscaling, preview-cache insertion, and JNI buffer copy.
'''
          if old_comment not in render:
              raise SystemExit('render lock comment missing')
          ram_path = '''    ensure_not_cancelled(&cancellation)?;
    if let Some(source_pixels) = source_quality_ram_hit(session_id, frame_id, &state)? {
        ensure_not_cancelled(&cancellation)?;
        let preview = downscale_scrub_preview(&source_pixels, max_edge)
            .map_err(|error| PreviewFailure::new("preview_scale_error", error.to_string()))?;
        ensure_not_cancelled(&cancellation)?;
        {
            let mut state = state.lock().map_err(|_| {
                PreviewFailure::new("bridge_error", "Live preview cache state is poisoned.")
            })?;
            state.preview_cache.insert(frame_id, max_edge, preview.clone());
        }
        return finish_preview(
            session_id,
            frame_id,
            timestamp_us,
            preview,
            "source_ram",
            0,
            destination,
        );
    }

'''
          render = render.replace(old_comment, ram_path + '''    // A source-quality RAM hit was already handled above and scaled outside the authoritative
    // microscope lock. Only an actual preview miss re-enters the source/index borrow for exact
    // metadata reconciliation plus direct bounded native conversion.
''', 1)

          ds_start = render.index('        let ScrubSessionState {')
          ds_end_marker = '        } = &mut *state;'
          ds_end = render.index(ds_end_marker, ds_start) + len(ds_end_marker)
          render = render[:ds_start] + '        let ScrubSessionState { decoder_cursor, .. } = &mut *state;' + render[ds_end:]

          bounded_call = render.index('navigate_to_frame_bounded_preview_with_cursor(')
          call_end = render.index('        )', bounded_call)
          call = render[bounded_call:call_end]
          call = replace_once(call, '            source_cache,\n', '', 'interactive bounded cache argument')
          render = render[:bounded_call] + call + render[call_end:]

          source_start = render.index('    let source = match navigated.source {')
          decoded_line = render.index('    let decoded_frames = navigated.decoded_frames;', source_start)
          render = render[:source_start] + render[decoded_line:]
          render = replace_once(render, '        source,\n', '        "decoded",\n', 'interactive finish source')
          text = text[:render_start] + render + text[render_end:]
          ffi.write_text(text)
          PY

      - name: Validate Rust workspace
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          cd rust
          cargo +1.85.1 fmt --all
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings
          cargo +1.85.1 test --workspace

      - name: Verify final source-only diff and commit
        run: |
          rm -f .github/workflows/fix-preview-lock-scope.yml
          rm -f .github/workflows/fix-preview-lock-scope-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep preview scaling outside microscope lock'
          git push origin HEAD:perf/direct-bounded-scrub-preview
