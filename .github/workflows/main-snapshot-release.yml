name: Main snapshot release

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/main-snapshot-release.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: main-snapshot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-workflow:
    name: validate-workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm publisher workflow parsed on pull request
        run: echo 'main snapshot publisher workflow parsed successfully'

  publish-main-snapshot:
    name: publish-main-snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Wait for successful canonical CI on exact commit
        run: |
          set -euo pipefail

          ci_run_id=""
          for attempt in $(seq 1 120); do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=push&per_page=20")"

            ci_run_id="$(jq -r --arg sha "$HEAD_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(.head_branch == "main")
                | select(.event == "push")]
              | sort_by(.run_number)
              | last
              | .id // empty
            ' <<<"$runs")"

            if [[ -z "$ci_run_id" ]]; then
              echo "canonical CI for $HEAD_SHA has not been scheduled yet (attempt $attempt/120)"
              sleep 15
              continue
            fi

            run="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id")"

            read -r status conclusion run_sha run_branch run_event <<<"$(
              jq -r '[.status, (.conclusion // ""), .head_sha, .head_branch, .event] | @tsv' <<<"$run"
            )"

            if [[ "$run_sha" != "$HEAD_SHA" || "$run_branch" != "main" || "$run_event" != "push" ]]; then
              echo "error: resolved canonical CI run identity does not match exact main commit" >&2
              exit 1
            fi

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "error: canonical CI run $ci_run_id completed with $conclusion; snapshot will not publish" >&2
                exit 1
              fi
              echo "canonical CI run $ci_run_id succeeded for $HEAD_SHA"
              echo "CI_RUN_ID=$ci_run_id" >> "$GITHUB_ENV"
              break
            fi

            echo "canonical CI run $ci_run_id is $status (attempt $attempt/120)"
            ci_run_id=""
            sleep 15
          done

          if [[ -z "${ci_run_id:-}" ]]; then
            echo "error: timed out waiting for successful canonical CI for $HEAD_SHA" >&2
            exit 1
          fi

      - name: Download exact verified APK artifact
        run: |
          set -euo pipefail
          artifact="framescope-debug-$HEAD_SHA"
          mkdir -p build/main-snapshot

          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" \
            --dir build/main-snapshot

          apk_count="$(find build/main-snapshot -type f -name '*.apk' | wc -l | tr -d ' ')"
          test "$apk_count" = "1" || {
            echo "error: expected exactly one APK in $artifact, found $apk_count" >&2
            exit 1
          }

          apk="$(find build/main-snapshot -type f -name '*.apk' -print -quit)"
          test -s "$apk"

          short_sha="${HEAD_SHA:0:12}"
          staged="build/FrameScope-main-${short_sha}-arm64-v8a-debug.apk"
          cp "$apk" "$staged"
          sha256sum "$staged" > "$staged.sha256"
          sha256sum --check "$staged.sha256"

          echo "SNAPSHOT_APK=$staged" >> "$GITHUB_ENV"
          echo "SNAPSHOT_SHA256=$staged.sha256" >> "$GITHUB_ENV"
          echo "SNAPSHOT_TAG=main-$short_sha" >> "$GITHUB_ENV"
          echo "SNAPSHOT_TITLE=FrameScope main $short_sha" >> "$GITHUB_ENV"

      - name: Publish immutable main snapshot pre-release
        run: |
          set -euo pipefail
          notes="Automated installable debug snapshot from main commit $HEAD_SHA.

This pre-release was published only after canonical CI completed successfully for this exact main commit. The APK is the exact durable artifact produced and native-packaging-verified by that CI run. It is intended for testing and is not the signed, physically certified production release. Production v* releases remain protected by the Phase 7 physical-device and signing gates."

          if gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$SNAPSHOT_TAG" \
              "$SNAPSHOT_APK" \
              "$SNAPSHOT_SHA256" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$SNAPSHOT_TAG" \
              "$SNAPSHOT_APK" \
              "$SNAPSHOT_SHA256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$HEAD_SHA" \
              --prerelease \
              --title "$SNAPSHOT_TITLE" \
              --notes "$notes"
          fi
