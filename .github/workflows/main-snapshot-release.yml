name: Main snapshot release

on:
  pull_request:
    paths:
      - '.github/workflows/main-snapshot-release.yml'
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: main-snapshot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo ok

  publish-main-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Wait for successful canonical CI on exact commit
        run: |
          set -euo pipefail
          ci_run_id=""
          for attempt in $(seq 1 120); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=push&per_page=20")"
            ci_run_id="$(jq -r --arg sha "$HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha) | select(.head_branch == "main") | select(.event == "push")] | sort_by(.run_number) | last | .id // empty' <<<"$runs")"

            if [[ -z "$ci_run_id" ]]; then
              echo "canonical CI for $HEAD_SHA has not been scheduled yet (attempt $attempt/120)"
              sleep 15
              continue
            fi

            run="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            run_sha="$(jq -r '.head_sha' <<<"$run")"
            run_branch="$(jq -r '.head_branch' <<<"$run")"
            run_event="$(jq -r '.event' <<<"$run")"

            if [[ "$run_sha" != "$HEAD_SHA" || "$run_branch" != "main" || "$run_event" != "push" ]]; then
              echo "error: resolved canonical CI run identity does not match exact main commit" >&2
              exit 1
            fi

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "error: canonical CI run $ci_run_id completed with $conclusion; snapshot will not publish" >&2
                exit 1
              fi
              echo "canonical CI run $ci_run_id succeeded for $HEAD_SHA"
              echo "CI_RUN_ID=$ci_run_id" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "canonical CI run $ci_run_id is $status (attempt $attempt/120)"
            sleep 15
          done

          echo "error: timed out waiting for successful canonical CI for $HEAD_SHA" >&2
          exit 1
