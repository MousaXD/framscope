name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: '27.3.13750724'
  CARGO_NDK_VERSION: '4.1.2'
  GRADLE_VERSION: '8.13'
  RUST_HOST_TOOLCHAIN: '1.85.1'
  RUST_ANDROID_TOOLCHAIN: '1.86.0'

jobs:
  signed-release:
    name: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.FRAMESCOPE_SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.FRAMESCOPE_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.FRAMESCOPE_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.FRAMESCOPE_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout release tag with acceptance ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag matches source version
        run: bash ./scripts/verify-release-version.sh "$GITHUB_REF_NAME"

      - name: Require accepted physical-device evidence
        run: |
          report="acceptance/phase7/device-report.json"
          test -f "$report" || {
            echo "error: Phase 7 physical-device report is not committed; production release is locked" >&2
            exit 1
          }
          python3 ./scripts/verify-phase7-device-report.py "$report"

          tested_commit="$(python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))['tested_commit'])
          PY
          )"
          reported_version="$(python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))['app_version'])
          PY
          )"
          source_version="$(awk -F= '$1 == "versionName" { print $2 }' version.properties | tr -d '\r')"
          test "$reported_version" = "$source_version" || {
            echo "error: physical report version $reported_version does not match source version $source_version" >&2
            exit 1
          }

          git cat-file -e "$tested_commit^{commit}" || {
            echo "error: tested physical-device commit is unavailable: $tested_commit" >&2
            exit 1
          }
          git merge-base --is-ancestor "$tested_commit" "$GITHUB_SHA" || {
            echo "error: tested physical-device commit is not an ancestor of the release tag" >&2
            exit 1
          }

          apk_affecting_paths=(
            android
            rust
            version.properties
            scripts/build-rust.sh
            scripts/build-ffmpeg-android.sh
            scripts/verify-ffmpeg-android.sh
            .github/workflows/release.yml
            .github/workflows/phase7-device-kit.yml
          )
          if ! git diff --quiet "$tested_commit" "$GITHUB_SHA" -- "${apk_affecting_paths[@]}"; then
            echo "error: APK-affecting inputs changed after physical-device acceptance; retest the current source" >&2
            git diff --name-only "$tested_commit" "$GITHUB_SHA" -- "${apk_affecting_paths[@]}" >&2
            exit 1
          fi

      - name: Require complete release signing material
        run: |
          test -n "$SIGNING_KEYSTORE_B64" || { echo "error: FRAMESCOPE_SIGNING_KEYSTORE_B64 is not configured" >&2; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "error: FRAMESCOPE_SIGNING_STORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "error: FRAMESCOPE_SIGNING_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "error: FRAMESCOPE_SIGNING_KEY_PASSWORD is not configured" >&2; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install FFmpeg fixture and development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev

      - name: Set up Rust host checks
        run: |
          rustup toolchain install "$RUST_HOST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_HOST_TOOLCHAIN"

      - name: Verify Rust workspace before signing
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Verify real media integration before signing
        run: |
          bash ./scripts/generate-video-fixtures.sh
          python3 ./scripts/verify-video-fixtures.py
          bytes="$(du -sb build/video-fixtures | cut -f1)"
          test "$bytes" -le 1048576
          cd rust
          cargo clippy -p framescope-video --features system-ffmpeg --all-targets -- -D warnings
          cargo test -p framescope-video --features system-ffmpeg

      - name: Set up Rust Android target
        run: |
          rustup toolchain install "$RUST_ANDROID_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_ANDROID_TOOLCHAIN"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"

      - name: Decode ephemeral signing keystore
        run: |
          store="$RUNNER_TEMP/framescope-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$store"
          chmod 600 "$store"
          echo "FRAMESCOPE_SIGNING_STORE_FILE=$store" >> "$GITHUB_ENV"
          echo "FRAMESCOPE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FRAMESCOPE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FRAMESCOPE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build and test signed release
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: Verify signed release package
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          bash ./scripts/verify-release-apk.sh "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Stage immutable release assets
        run: |
          version="$(awk -F= '$1 == "versionName" { print $2 }' version.properties | tr -d '\r')"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/FrameScope-$version-arm64-v8a.apk"
          (cd release-assets && sha256sum "FrameScope-$version-arm64-v8a.apk" > "FrameScope-$version-arm64-v8a.apk.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F= '$1 == "versionName" { print $2 }' version.properties | tr -d '\r')"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/FrameScope-$version-arm64-v8a.apk" \
            "release-assets/FrameScope-$version-arm64-v8a.apk.sha256" \
            --verify-tag \
            --title "FrameScope $version" \
            --generate-notes
