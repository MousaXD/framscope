name: Phase 7 production/release contracts

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: '27.3.13750724'
  CARGO_NDK_VERSION: '4.1.2'
  GRADLE_VERSION: '8.13'
  RUST_HOST_TOOLCHAIN: '1.85.1'
  RUST_ANDROID_TOOLCHAIN: '1.86.0'

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_AUDIT_VERSION: '0.22.2'
      CARGO_AUDIT_SHA256: 'ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify immutable build dependency declarations
        run: python3 ./scripts/verify-build-supply-chain.py

      - name: Set up pinned Rust host toolchain
        run: |
          rustup toolchain install "$RUST_HOST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_HOST_TOOLCHAIN"

      - name: Verify Cargo.lock is committed and synchronized
        run: |
          if ! git ls-files --error-unmatch rust/Cargo.lock >/dev/null 2>&1; then
            cargo generate-lockfile --manifest-path rust/Cargo.toml
            python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = gzip.compress(Path("rust/Cargo.lock").read_bytes(), mtime=0)
          print("FRAMESCOPE_CARGO_LOCK_GZIP_BASE64=" + base64.b64encode(payload).decode("ascii"))
          PY
            echo "error: rust/Cargo.lock is not committed; commit the emitted Cargo 1.85.1 candidate" >&2
            exit 1
          fi
          cargo metadata --format-version 1 --manifest-path rust/Cargo.toml >/dev/null
          git diff -- rust/Cargo.lock
          git diff --exit-code -- rust/Cargo.lock

      - name: Verify dependency sources licenses and lockfile checksums
        run: python3 ./scripts/verify-rust-supply-chain.py

      - name: Install checksum-verified cargo-audit
        run: |
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          extract_dir="$RUNNER_TEMP/cargo-audit"
          url="https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$url" -o "$archive"
          echo "$CARGO_AUDIT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          audit_bin="$(find "$extract_dir" -type f -name cargo-audit -print -quit)"
          test -n "$audit_bin"
          install -m 0755 "$audit_bin" "$HOME/.cargo/bin/cargo-audit"
          cargo audit --version

      - name: Reject known RustSec vulnerabilities
        run: cargo audit --file rust/Cargo.lock

  large-media-stress:
    name: large-media-stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRAMESCOPE_PHASE7_STRESS_FRAMES: '100000'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install measurement tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends time

      - name: Set up pinned Rust host toolchain
        run: |
          rustup toolchain install "$RUST_HOST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_HOST_TOOLCHAIN"

      - name: Compile large-stream stress harness
        working-directory: rust
        run: cargo test -p framescope-extraction-output --test phase7_large_stream --no-run --locked

      - name: Run deterministic large-stream extraction stress
        run: |
          set -o pipefail
          mkdir -p build
          /usr/bin/time -v -o build/phase7-large-media-time.txt \
            cargo test \
              --manifest-path rust/Cargo.toml \
              -p framescope-extraction-output \
              --test phase7_large_stream \
              phase7_large_streaming_export_stays_bounded \
              --locked \
              -- \
              --ignored \
              --exact \
              --nocapture \
            | tee build/phase7-large-media-test.log
          cat build/phase7-large-media-time.txt

      - name: Preserve hosted-runner performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-large-media-stress-${{ github.sha }}
          path: |
            build/phase7-large-media-time.txt
            build/phase7-large-media-test.log
          if-no-files-found: warn
          retention-days: 7

  release-package:
    name: release-package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust Android target
        run: |
          rustup toolchain install "$RUST_ANDROID_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_ANDROID_TOOLCHAIN"

      - name: Restore Cargo Android build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            rust/target
          key: cargo-android-arm64-rust-${{ env.RUST_ANDROID_TOOLCHAIN }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/crates/**/Cargo.toml', 'rust/crates/framescope-ffmpeg/build.rs', 'rust/crates/framescope-ffmpeg/native/**', 'scripts/build-rust.sh', 'scripts/build-ffmpeg-android.sh', 'scripts/verify-ffmpeg-android.sh') }}
          restore-keys: |
            cargo-android-arm64-rust-${{ env.RUST_ANDROID_TOOLCHAIN }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-

      - name: Install cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "cargo-ndk $CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
          fi

      - name: Verify semantic version contract
        run: |
          version="$(awk -F= '$1 == "versionName" { print $2 }' version.properties | tr -d '\r')"
          bash ./scripts/verify-release-version.sh "v$version"

      - name: Build unsigned release candidate
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK
        run: bash ./scripts/verify-release-apk.sh

      - name: Record candidate checksum
        run: sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk
