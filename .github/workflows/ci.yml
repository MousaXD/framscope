name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: '27.3.13750724'
  CARGO_NDK_VERSION: '4.1.2'
  GRADLE_VERSION: '8.13'
  RUST_HOST_TOOLCHAIN: '1.85.1'
  RUST_ANDROID_TOOLCHAIN: '1.86.0'

jobs:
  rust-fast:
    name: rust-fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_HOST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_HOST_TOOLCHAIN"

      - name: Cache Cargo host build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-host-${{ runner.os }}-rust-${{ env.RUST_HOST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.toml', 'rust/crates/**/Cargo.toml') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-rust-${{ env.RUST_HOST_TOOLCHAIN }}-

      - name: Rust format
        working-directory: rust
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace

  native-android:
    name: native-android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust Android target
        run: |
          rustup toolchain install "$RUST_ANDROID_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_ANDROID_TOOLCHAIN"

      - name: Cache Cargo Android build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            rust/target
          key: cargo-android-arm64-rust-${{ env.RUST_ANDROID_TOOLCHAIN }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/crates/**/Cargo.toml', 'rust/crates/framescope-ffmpeg/build.rs', 'rust/crates/framescope-ffmpeg/native/**', 'scripts/build-rust.sh', 'scripts/build-ffmpeg-android.sh', 'scripts/verify-ffmpeg-android.sh') }}
          restore-keys: |
            cargo-android-arm64-rust-${{ env.RUST_ANDROID_TOOLCHAIN }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-

      - name: Install cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "cargo-ndk $CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
          fi

      - name: Build and verify native arm64 library
        run: bash ./scripts/verify-native-android.sh

  android:
    name: android
    runs-on: ubuntu-latest
    needs: native-android
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust Android target
        run: |
          rustup toolchain install "$RUST_ANDROID_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_ANDROID_TOOLCHAIN"

      - name: Restore Cargo Android build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            rust/target
          key: cargo-android-arm64-rust-${{ env.RUST_ANDROID_TOOLCHAIN }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ hashFiles('rust/Cargo.toml', 'rust/crates/**/Cargo.toml', 'rust/crates/framescope-ffmpeg/build.rs', 'rust/crates/framescope-ffmpeg/native/**', 'scripts/build-rust.sh', 'scripts/build-ffmpeg-android.sh', 'scripts/verify-ffmpeg-android.sh') }}
          restore-keys: |
            cargo-android-arm64-rust-${{ env.RUST_ANDROID_TOOLCHAIN }}-ndk-${{ env.ANDROID_NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-

      - name: Install cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "cargo-ndk $CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
          fi

      - name: Android unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Compile Compose semantic Android tests
        working-directory: android
        run: gradle --no-daemon assembleDebugAndroidTest

      - name: Android lint
        working-directory: android
        run: gradle --no-daemon lintDebug

      - name: Android debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK native packaging
        run: bash ./scripts/verify-debug-apk.sh

      - name: Upload debug APK for durable builds
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: framescope-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  video-fixtures:
    name: video-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install FFmpeg fixture and development tools
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev
          ffmpeg -version | head -n 1

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_HOST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_HOST_TOOLCHAIN"

      - name: Generate deterministic video fixtures
        run: bash ./scripts/generate-video-fixtures.sh

      - name: Verify fixture metadata contracts
        run: python3 ./scripts/verify-video-fixtures.py

      - name: Enforce fixture size budget
        run: |
          bytes="$(du -sb build/video-fixtures | cut -f1)"
          echo "fixture bytes: $bytes"
          test "$bytes" -le 1048576

      - name: Clippy real video engine integration
        working-directory: rust
        run: cargo clippy -p framescope-video --features system-ffmpeg --all-targets -- -D warnings

      - name: Test real video engine integration
        working-directory: rust
        run: cargo test -p framescope-video --features system-ffmpeg
