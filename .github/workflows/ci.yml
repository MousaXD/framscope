name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust format
        working-directory: rust
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace

      - name: Android unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        working-directory: android
        run: gradle --no-daemon lintDebug

      - name: Android debug build
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify packaged Rust JNI library
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          NATIVE_LIB="android/app/build/generated/jniLibs/arm64-v8a/libframescope_ffi.so"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libframescope_ffi.so'
          test -f "$NATIVE_LIB"
          if command -v nm >/dev/null 2>&1; then
            nm -D "$NATIVE_LIB" | grep -q 'Java_com_framescope_app_data_RustBridge_nativeVersion'
            nm -D "$NATIVE_LIB" | grep -q 'Java_com_framescope_app_data_RustBridge_nativeInspectVideoFd'
          fi

      - name: Verify privacy permissions
        run: |
          ! grep -R --line-number --fixed-string 'android.permission.INTERNET' android/app/src/main
          ! grep -R --line-number -E 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
