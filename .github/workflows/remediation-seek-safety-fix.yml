name: Remediation seek-safety integration fix

on:
  push:
    branches:
      - perf/remediation-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/remediation-integration
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 .github/remediation_seek_patch.py
      - name: Install pinned formatting component
        run: rustup component add --toolchain 1.85.1-x86_64-unknown-linux-gnu rustfmt
      - name: Format and run focused navigation regressions
        run: |
          cd rust
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all --check
          cargo +1.85.1 test -p framescope-video target_rgba_navigation --lib
      - name: Commit product fix and remove temporary helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remediation-seek-safety-fix.yml .github/remediation_seek_patch.py
          git add rust/crates/framescope-video/src/target_rgba_navigation.rs
          git commit -m 'fix(integration): enforce seek safety in scrub fast path'
          git push origin HEAD:perf/remediation-integration
