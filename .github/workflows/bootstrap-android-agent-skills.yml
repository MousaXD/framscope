name: Bootstrap Android agent skills

on:
  push:
    branches:
      - chore/android-agent-skills

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Android CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install selected official Android skills for Codex
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          command -v android
          android --version
          mkdir -p .agents/skills
          for skill in \
            android-cli \
            testing-setup \
            android-profiler \
            r8-analyzer \
            edge-to-edge \
            android-intent-security \
            adaptive \
            navigation-3
          do
            android skills add "$skill" --project=. --agent=codex
          done

      - name: Verify installed skills
        shell: bash
        run: |
          set -euo pipefail
          for skill in \
            android-cli \
            testing-setup \
            android-profiler \
            r8-analyzer \
            edge-to-edge \
            android-intent-security \
            adaptive \
            navigation-3
          do
            test -f ".agents/skills/$skill/SKILL.md"
          done
          find .agents/skills -maxdepth 2 -name SKILL.md -print | sort

      - name: Commit installed skills and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-android-agent-skills.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills .github/workflows/bootstrap-android-agent-skills.yml
          git diff --cached --check
          git status --short
          git commit -m "chore: add official Android agent skills [skip ci]"
          git push origin HEAD:chore/android-agent-skills
