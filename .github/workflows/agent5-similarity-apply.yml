name: Agent 5 similarity correctness patch

on:
  push:
    branches:
      - perf/similarity-correctness

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[agent5-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/similarity-correctness
          fetch-depth: 0

      - name: Apply audited similarity remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # framescope-perceptual: replace luma-only final confirmation with deterministic RGB
          # confirmation while preserving the production dHash gate. Add a diagnostic path that
          # runs confirmation for hash rejects so the false-negative mode is measurable without
          # silently changing production recall policy.
          p = Path('rust/crates/framescope-perceptual/src/lib.rs')
          text = p.read_text()
          text = text.replace(
              'use framescope_similarity::{SimilarityEngine, SimilarityError, SimilarityMode, SimilarityScore};',
              'use framescope_similarity::{SIMILARITY_SCALE, SimilarityError, SimilarityScore};'
          )
          text = text.replace(
              'pub const DHASH_BITS: u32 = 64;\n',
              'pub const DHASH_BITS: u32 = 64;\n/// Persisted derived-group semantics generation for the hybrid metric.\n///\n/// Bump this whenever hash sampling, confirmation color semantics, or score normalization changes.\npub const HYBRID_SIMILARITY_ALGORITHM_VERSION: u32 = 2;\n'
          )
