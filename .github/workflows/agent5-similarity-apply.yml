name: Agent 5 similarity correctness patch

on:
  push:
    branches:
      - perf/similarity-correctness

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[agent5-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/similarity-correctness
          fetch-depth: 0

      - name: Apply audited similarity remediation
        run: |
          python3 .github/agent5_similarity_patch.py
          python3 .github/agent5_similarity_patch_fixes.py

      - name: Set up Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1

      - name: Format and verify focused similarity contracts
        working-directory: rust
        run: |
          cargo fmt --all
          cargo clippy -p framescope-similarity -p framescope-perceptual -p framescope-grouping -p framescope-grouping-session -p framescope-similarity-store -p framescope-group-navigation --all-targets -- -D warnings
          cargo test -p framescope-similarity
          cargo test -p framescope-perceptual
          cargo test -p framescope-grouping
          cargo test -p framescope-grouping-session
          cargo test -p framescope-similarity-store
          cargo test -p framescope-group-navigation

      - name: Commit verified implementation
        run: |
          git config user.name "FrameScope Agent 5"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git add rust/crates/framescope-perceptual rust/crates/framescope-grouping rust/crates/framescope-similarity-store rust/crates/framescope-group-navigation android/app/src/main/java/com/framescope/app/ui/ExtractionWorkflow.kt
          git commit -m "fix(similarity): make consecutive grouping color-aware and persistence-safe [agent5-patch]"
          git push origin HEAD:perf/similarity-correctness
